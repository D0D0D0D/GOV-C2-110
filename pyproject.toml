[project]
name = "gov-c2-110"
version = "1.0.0"
description = "MunicipalContractVariationEvidenceBriefAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# supplied by the platform's own package registry at build time. Pinning it here
# would make `pip install -e .` fail because it is not resolvable from the
# default index.
# PyYAML is used directly by src/api/server.py to load config/config.yaml, so
# it is declared here rather than relied on as a transitive dependency of the
# framework wheel (exact pin per IMP-0002).
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
